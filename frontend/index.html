<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INFINITY AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Source+Serif+4:wght@400;500&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#070706;--panel:rgba(16,14,10,.82);--ink:#f1e8d0;--mute:#8f8156;--line:#2c2511;--gold:#d4af37;--gold2:#f6dc84;--ubub:#1d1810;--code:#050504;--lv:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:radial-gradient(1200px 600px at 70% -10%,#1a1405,var(--bg));color:var(--ink);font-family:'Sora',system-ui,sans-serif;font-size:15px;overflow:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{display:flex;height:100%;position:relative;z-index:1}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
aside{width:260px;background:var(--panel);backdrop-filter:blur(14px);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:12px;flex-shrink:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px}
.wm{font-weight:700;letter-spacing:.14em;font-size:15px;background:linear-gradient(100deg,#8a6a1c 20%,#fff1b0 45%,#d4af37 55%,#8a6a1c 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}
@keyframes sh{to{background-position:-250% 0}}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--gold);border:1px solid var(--line);flex-shrink:0;transition:.18s}
.ib:hover{border-color:var(--gold);background:#1a1508;box-shadow:0 0 14px rgba(212,175,55,.25)}
.ib:active{transform:scale(.92)}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;border-radius:8px;padding:9px 10px;color:var(--mute);gap:6px;cursor:pointer}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item:hover,.item.on{background:rgba(255,255,255,.04);color:var(--ink)}
.item.on{box-shadow:inset 2px 0 0 var(--gold)}
.item button{color:var(--mute);opacity:0;padding:2px}.item:hover button{opacity:1}
.item svg.i{width:15px;height:15px}
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#burger{display:none;position:absolute;top:12px;left:12px;z-index:2;background:var(--panel)}
#msgs{flex:1;overflow-y:auto;padding:28px 18px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px;min-height:100%}
.m{display:flex;gap:12px;line-height:1.65;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.m.u{flex-direction:column;align-items:flex-end;gap:6px}
.m.u .b{background:linear-gradient(135deg,#241c0c,#16120a);border:1px solid #3a2f13;padding:10px 15px;border-radius:16px 16px 4px 16px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.m.a .av{width:28px;height:28px;flex-shrink:0;margin-top:2px}
.m.a .c{min-width:0;max-width:70ch}
.m.a .b{font-family:'Source Serif 4',Georgia,serif;font-size:16.5px;overflow-wrap:anywhere}
.act{display:flex;gap:2px;margin-top:6px;opacity:.55}.act:hover{opacity:1}
.act button{padding:5px;border-radius:8px;color:var(--mute)}.act button:hover{color:var(--gold);background:rgba(212,175,55,.08)}
.act svg.i{width:16px;height:16px}
.imgs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.imgs img{width:120px;height:120px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#14110a;color:var(--gold2);border-radius:10px;padding:5px 9px;font-size:12.5px;max-width:200px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chip svg.i{width:14px;height:14px;flex-shrink:0}
.b p{margin:0 0 .8em}.b p:last-child{margin:0}
.b h3{font-family:'Sora',sans-serif;margin:1em 0 .4em;color:var(--gold2)}
.b ul,.b ol{margin:.4em 0 .8em;padding-left:1.4em}
.b strong{color:var(--gold2)}
.b code{background:#1a1508;padding:1px 6px;border-radius:5px;font-size:.88em;color:var(--gold2)}
.cb{background:var(--code);border:1px solid var(--line);border-radius:10px;margin:.6em 0;overflow:hidden}
.cb .t{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;font:12px 'Sora',sans-serif;color:var(--mute);border-bottom:1px solid var(--line)}
.cb .t button{color:var(--mute);padding:2px}.cb .t svg.i{width:15px;height:15px}
.cb pre{margin:0;padding:12px;overflow-x:auto}.cb code{background:none;padding:0;font-size:13.5px;color:#e9dfc2}
.cur{display:inline-block;width:8px;height:1em;background:var(--gold);vertical-align:text-bottom;animation:bl 1s steps(2) infinite;box-shadow:0 0 10px var(--gold)}
@keyframes bl{50%{opacity:0}}
.empty{margin:auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty svg.big{width:120px;height:120px;filter:drop-shadow(0 0 30px rgba(212,175,55,.4));animation:fl 6s ease-in-out infinite}
.empty .wm{font-size:30px;letter-spacing:.3em;padding-left:.3em}
@keyframes fl{50%{transform:translateY(-8px)}}
.trace{stroke-dasharray:40 120;animation:tr 3.2s linear infinite}
@keyframes tr{to{stroke-dashoffset:-320}}
.composer{padding:8px 18px 18px}
#thumbs{max-width:780px;margin:0 auto 8px;display:flex;gap:8px;flex-wrap:wrap}
.th{position:relative}
.th img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--gold)}
.th .chip{height:34px}
.th>button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#000;display:grid;place-items:center}
.th>button svg.i{width:12px;height:12px;stroke-width:2.6}
.box{max-width:780px;margin:0 auto;display:flex;gap:6px;align-items:flex-end;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);border-radius:28px;padding:7px;transition:.2s}
.box:focus-within{border-color:var(--gold);box-shadow:0 0 24px rgba(212,175,55,.18)}
textarea{flex:1;resize:none;border:0;outline:0;background:none;color:inherit;font:inherit;max-height:180px;padding:9px 4px;line-height:1.5}
.box .ib{border-color:transparent}
#send{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#000;border:0}
#mic.on{background:var(--gold);color:#000;box-shadow:0 0 calc(6px + var(--lv)*34px) rgba(246,220,132,.8)}
#spk.on,#deep.on{color:#000;background:var(--gold)}
#lang{font-size:11px;font-weight:600;width:34px}
.toast{max-width:780px;margin:0 auto 8px;text-align:center;font-size:13px;color:#e0765c}
#vo{position:fixed;inset:0;z-index:20;background:rgba(5,4,2,.93);backdrop-filter:blur(10px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:20px}
#vo.show{display:flex}
#orb{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3bd,#d4af37 45%,#6b4f0e);box-shadow:0 0 70px rgba(212,175,55,.45);transform:scale(calc(1 + var(--lv)*.45));transition:transform .08s;cursor:pointer;animation:br 3.5s ease-in-out infinite}
#vo.think #orb{animation:sp 1s linear infinite;border-radius:42% 58% 55% 45%}
#vo.talk #orb{animation:br .8s ease-in-out infinite}
@keyframes br{50%{box-shadow:0 0 110px rgba(246,220,132,.7)}}
@keyframes sp{to{rotate:360deg}}
#vt{max-width:560px;text-align:center;color:var(--mute);font-family:'Source Serif 4',serif;font-size:19px;min-height:60px;overflow:hidden}
body.drag::after{content:"";position:fixed;inset:10px;border:2px dashed var(--gold);border-radius:20px;z-index:30;pointer-events:none;background:rgba(212,175,55,.06)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
@media(max-width:760px){
aside{position:fixed;z-index:5;top:0;bottom:0;left:0;padding-top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-100%);transition:transform .2s}
aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.6)}
#burger{display:grid;top:calc(12px + env(safe-area-inset-top,0px))}#msgs{padding-top:60px}#lang{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.locked .app{visibility:hidden}
.hi{color:var(--mute);font-size:17px;font-family:'Source Serif 4',serif}.hi b{color:var(--gold2);font-weight:600}
/* intro */
#splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(700px 460px at 50% 46%,rgba(212,175,55,.13),transparent 70%);transition:opacity .7s ease,visibility .7s;cursor:pointer}
#splash.out{opacity:0;visibility:hidden}
.sp-logo{width:150px;height:150px;position:relative;display:grid;place-items:center;animation:fl 5s ease-in-out 2s infinite}
.sp-logo svg{width:100%;height:100%;overflow:visible;animation:glw 1.6s 1.7s ease forwards}
@keyframes glw{to{filter:drop-shadow(0 0 22px rgba(246,220,132,.65))}}
.sp-ring{position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(212,175,55,.45);opacity:0;animation:ring 2.8s ease-out infinite 1.2s}
.sp-ring.r2{animation-delay:2.6s}
@keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.1);opacity:0}}
.sp-box{opacity:0;animation:fi .9s ease forwards}
@keyframes fi{to{opacity:1}}
.sp-draw{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.9s .35s cubic-bezier(.6,.1,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sp-title{display:flex;font-weight:700;font-size:clamp(30px,7vw,56px);letter-spacing:.14em;min-height:1.3em}
.sp-title span{opacity:0;transform:translateY(26px) scale(.7);filter:blur(10px);background:linear-gradient(180deg,#fff3bd,#d4af37 60%,#8a6a1c);-webkit-background-clip:text;background-clip:text;color:transparent;animation:lt .8s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes lt{to{opacity:1;transform:none;filter:none}}
.sp-line{height:2px;width:0;background:linear-gradient(90deg,transparent,#f6dc84,transparent);animation:ln 1.2s 2.5s ease forwards}
@keyframes ln{to{width:min(320px,70vw)}}
.sp-by,.by{color:#ffd21f;font-weight:600;text-shadow:0 0 16px rgba(255,210,31,.5)}
.sp-by{font-size:clamp(11px,2.4vw,14px);letter-spacing:.7em;opacity:0;animation:by 1.3s 3s ease forwards;padding-left:.7em}
@keyframes by{to{opacity:1;letter-spacing:.38em}}
/* login page */
#auth{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#auth.show{display:flex;animation:fi2 .7s ease}
@keyframes fi2{from{opacity:0}}
#auth .card{width:100%;max-width:410px;margin:auto;display:flex;flex-direction:column;gap:12px;border:1px solid #3a2f13;background:rgba(12,10,6,.78);backdrop-filter:blur(20px);border-radius:26px;padding:30px 26px 22px;box-shadow:0 0 90px rgba(212,175,55,.13),inset 0 1px 0 rgba(255,255,255,.05);animation:rise .8s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}}
.chead{display:flex;align-items:center;justify-content:center;gap:10px}
#auth h2{margin:6px 0 0;text-align:center;font-size:22px;font-weight:600;letter-spacing:-.01em}
#auth .sub{margin:0 0 6px;text-align:center;color:var(--mute);font-size:13.5px}
#auth .f{position:relative}
#auth .su{display:none}#auth .card.signup .su{display:block;animation:in .35s ease}
#auth input{width:100%;background:#0b0905;border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:13px 15px;font:inherit;outline:0;transition:.2s}
#auth input::placeholder{color:#6c6140}
#auth input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.14)}
#auth .pw input{padding-right:62px}
#eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--gold);padding:6px 9px;border-radius:8px}
#eye:hover{background:rgba(212,175,55,.1)}
#am{min-height:20px;text-align:center;font-size:13px;line-height:1.4}
#am.e{color:#ef8a73}#am.ok{color:#8fe3a1}
.pri{position:relative;overflow:hidden;border:0;border-radius:14px;padding:13px;font-weight:600;color:#1a1305;background:linear-gradient(135deg,#f6dc84,#d4af37 55%,#b8892a);box-shadow:0 8px 28px rgba(212,175,55,.25);transition:.2s;display:flex;justify-content:center;align-items:center;gap:8px}
.pri:hover{filter:brightness(1.1);transform:translateY(-1px)}.pri:active{transform:scale(.98)}
.pri::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:swp 3.2s ease-in-out infinite}
@keyframes swp{60%,100%{left:120%}}
.pri:disabled{opacity:.7;cursor:wait}
.spin{display:none;width:15px;height:15px;border:2px solid rgba(0,0,0,.25);border-top-color:#000;border-radius:50%;animation:rot .7s linear infinite}
.pri.load .spin{display:block}
@keyframes rot{to{transform:rotate(360deg)}}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
#gbtn{display:flex;justify-content:center;min-height:44px}
.gfake{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:340px;border:1px solid var(--line);border-radius:999px;padding:11px;background:#0b0905;font-weight:500;transition:.2s}
.gfake:hover{border-color:var(--gold);background:#16120a}
.swap{text-align:center;font-size:13.5px;color:var(--mute)}
.swap a{color:var(--gold2);cursor:pointer;font-weight:600;margin-left:4px}.swap a:hover{text-decoration:underline}
.by{text-align:center;font-size:10.5px;letter-spacing:.3em;margin-top:6px;padding-left:.3em}
/* welcome */
#wel{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(5,4,2,.9);backdrop-filter:blur(10px);transition:opacity .8s ease}
#wel.show{display:flex}#wel.out{opacity:0}
#wsp{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#wsp i{position:absolute;border-radius:50%;background:#f6dc84;box-shadow:0 0 12px #f6dc84;opacity:0;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%{opacity:0;transform:translateY(20px) scale(.4)}40%{opacity:1}100%{opacity:0;transform:translateY(-80px) scale(1)}}
.wbox{position:relative;text-align:center;padding:20px}
.wg{font-size:clamp(18px,4vw,26px);color:var(--mute);letter-spacing:.06em;opacity:0;animation:wu .9s .1s ease forwards}
.wn{font-weight:700;font-size:clamp(38px,10vw,84px);letter-spacing:-.01em;line-height:1.1;margin:6px 0 14px;opacity:0;background:linear-gradient(100deg,#8a6a1c 15%,#fff1b0 45%,#d4af37 55%,#8a6a1c 85%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:wu .9s .45s ease forwards,sh 4s linear infinite}
.wt{color:#ffd21f;font-weight:600;letter-spacing:.34em;font-size:clamp(11px,2.5vw,15px);opacity:0;animation:wu .9s .9s ease forwards;padding-left:.34em}
@keyframes wu{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.sp-draw{stroke-dashoffset:0}.sp-title span,.sp-by,.sp-box,.wg,.wn,.wt{opacity:1!important;transform:none!important;filter:none!important}.sp-line{width:200px}.sp-by{letter-spacing:.38em}}
</style>
</head>
<body class="locked">
<canvas id="bg"></canvas>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc84"/><stop offset="1" stop-color="#b8892a"/></linearGradient>
<symbol id="inf" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#070706" stroke="#d4af37" stroke-width="1.5"/><path d="M32 32C27 22 15 22 15 32s12 10 17 0 17-10 17 0-12 10-17 0Z" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="clip" viewBox="0 0 24 24"><path d="M21 11l-8.5 8.5a5 5 0 01-7-7L14 4a3.5 3.5 0 015 5l-8.5 8.5a2 2 0 01-3-3L15 7"/></symbol>
<symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></symbol>
<symbol id="spk" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zM16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></symbol>
<symbol id="wave" viewBox="0 0 24 24"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></symbol>
<symbol id="spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></symbol>
<symbol id="up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
<symbol id="stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
<symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
<symbol id="menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
<symbol id="copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></symbol>
<symbol id="ok" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
<symbol id="re" viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></symbol>
<symbol id="file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></symbol>
<symbol id="out" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 8l-4 4 4 4M6 12h10"/></symbol></defs></svg>
<div class="app">
<aside id="side">
  <div class="top"><div class="brand"><svg class="mark"><use href="#inf"/></svg><span class="wm">INFINITY AI</span></div><button class="ib" id="newBtn" aria-label="New chat"><svg class="i"><use href="#plus"/></svg></button></div>
  <div class="list" id="list"></div>
  <div style="display:flex;gap:8px"><button class="ib" id="clear" aria-label="Delete all chats"><svg class="i"><use href="#trash"/></svg></button><button class="ib" id="logout" aria-label="Log out"><svg class="i"><use href="#out"/></svg></button></div>
</aside>
<main>
  <button class="ib" id="burger" aria-label="Chats"><svg class="i"><use href="#menu"/></svg></button>
  <div id="msgs"><div class="wrap" id="wrap"></div></div>
  <div class="composer">
    <div class="toast" id="toast"></div>
    <div id="thumbs"></div>
    <div class="box">
      <button class="ib" id="pick" aria-label="Attach files"><svg class="i"><use href="#clip"/></svg></button>
      <input type="file" id="file" accept="image/*,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.java,.c,.cpp,.xml,.sql,.log,.yml,.yaml" multiple hidden>
      <textarea id="in" rows="1" aria-label="Message"></textarea>
      <button class="ib" id="deep" aria-label="Deep thinking"><svg class="i"><use href="#spark"/></svg></button>
      <button class="ib" id="lang" aria-label="Voice language">EN</button>
      <button class="ib" id="spk" aria-label="Read replies aloud"><svg class="i"><use href="#spk"/></svg></button>
      <button class="ib" id="mic" aria-label="Dictate"><svg class="i"><use href="#mic"/></svg></button>
      <button class="ib" id="vmode" aria-label="Voice conversation"><svg class="i"><use href="#wave"/></svg></button>
      <button class="ib" id="send" aria-label="Send"><svg class="i"><use href="#up"/></svg></button>
    </div>
  </div>

  }catch(e){msg(e.message==="Failed to fetch"?"Cannot reach the server. Is it running?":e.message,"e")}
  loading(false)}
async function googleLogin(cred){msg("");try{
    const r=await fetch("/api/auth/google",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({credential:cred})});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof j.detail==="string"?j.detail:"Google sign-in failed.");
    await enter(j.token,j.name)}catch(e){msg(e.message,"e")}}
const GICON='<svg viewBox="0 0 48 48" width="18" height="18"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>';
function fakeG(){const b=$("gbtn");b.innerHTML=`<button class="gfake" type="button">${GICON}<span>Continue with Google</span></button>`;
  b.firstChild.onclick=()=>msg("Google sign-in is not set up yet. Add GOOGLE_CLIENT_ID to backend/.env (steps are in the README).","e")}
function initGoogle(){
  if(!(gcfg&&gcfg.google_client_id))return fakeG();
  const sc=document.createElement("script");sc.src="https://accounts.google.com/gsi/client";sc.async=true;
  sc.onload=()=>{try{google.accounts.id.initialize({client_id:gcfg.google_client_id,callback:r=>googleLogin(r.credential)});
    google.accounts.id.renderButton($("gbtn"),{theme:"filled_black",size:"large",shape:"pill",text:"continue_with",width:300})}catch(e){fakeG()}};
  sc.onerror=fakeG;document.head.appendChild(sc)}
/* welcome wish */
function sparkle(){const w=$("wsp");w.innerHTML="";for(let i=0;i<34;i++){const d=document.createElement("i"),z=2+Math.random()*5;
  d.style.cssText=`left:${Math.random()*100}%;top:${30+Math.random()*60}%;width:${z}px;height:${z}px;animation-delay:${Math.random()*2}s;animation-duration:${2+Math.random()*2}s`;w.appendChild(d)}}
function welcome(name){const w=$("wel");$("wg").textContent=greet()+",";$("wn").textContent=name||"friend";sparkle();w.classList.remove("out");w.classList.add("show");
  setTimeout(()=>{w.classList.add("out");setLocked(false);cur=null;renderAll();setTimeout(()=>w.classList.remove("show","out"),850)},3200)}
async function enter(tok,name){token=tok;try{localStorage.setItem(TK,tok)}catch(_){}userName=name||"";
  $("auth").classList.remove("show");$("pw").value="";await load();welcome(userName)}
$("go").onclick=submit;
["nm","em","pw"].forEach(i=>$(i).addEventListener("keydown",e=>{if(e.key==="Enter")submit()}));
$("eye").onclick=()=>{const p=$("pw"),h=p.type==="password";p.type=h?"text":"password";$("eye").textContent=h?"Hide":"Show"};
$("sw").onclick=e=>{if(e.target.id==="swl")setMode(authMode==="login"?"signup":"login")};
$("logout").onclick=logout;
async function boot(){
  renderAll();setMode("login");
  try{gcfg=await (await fetch("/api/config")).json()}catch(_){gcfg={}}
  initGoogle();await splashDone;
  if(!token){showAuth();return}
  try{const r=await api("/me");if(!r.ok)throw 0;userName=(await r.json()).name;await load();setLocked(false);renderAll()}catch(e){showAuth()}}
boot();
</script>
