<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INFINITY AI</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#070706">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Source+Serif+4:wght@400;500&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#070706;--panel:rgba(16,14,10,.82);--ink:#f1e8d0;--mute:#8f8156;--line:#2c2511;--gold:#d4af37;--gold2:#f6dc84;--ubub:#1d1810;--code:#050504;--lv:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:radial-gradient(1200px 600px at 70% -10%,#1a1405,var(--bg));color:var(--ink);font-family:'Sora',system-ui,sans-serif;font-size:15px;overflow:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{display:flex;height:100%;position:relative;z-index:1}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
aside{width:260px;background:var(--panel);backdrop-filter:blur(14px);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:12px;flex-shrink:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px}
.wm{font-weight:700;letter-spacing:.14em;font-size:15px;background:linear-gradient(100deg,#8a6a1c 20%,#fff1b0 45%,#d4af37 55%,#8a6a1c 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}
@keyframes sh{to{background-position:-250% 0}}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--gold);border:1px solid var(--line);flex-shrink:0;transition:.18s}
.ib:hover{border-color:var(--gold);background:#1a1508;box-shadow:0 0 14px rgba(212,175,55,.25)}
.ib:active{transform:scale(.92)}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;border-radius:8px;padding:9px 10px;color:var(--mute);gap:6px;cursor:pointer}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item:hover,.item.on{background:rgba(255,255,255,.04);color:var(--ink)}
.item.on{box-shadow:inset 2px 0 0 var(--gold)}
.item button{color:var(--mute);opacity:0;padding:2px}.item:hover button{opacity:1}
.item svg.i{width:15px;height:15px}
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#burger{display:none;position:absolute;top:12px;left:12px;z-index:2;background:var(--panel)}
#msgs{flex:1;overflow-y:auto;padding:28px 18px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px;min-height:100%}
.m{display:flex;gap:12px;line-height:1.65;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.m.u{flex-direction:column;align-items:flex-end;gap:6px}
.m.u .b{background:linear-gradient(135deg,#241c0c,#16120a);border:1px solid #3a2f13;padding:10px 15px;border-radius:16px 16px 4px 16px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.m.a .av{width:28px;height:28px;flex-shrink:0;margin-top:2px}
.m.a .c{min-width:0;max-width:70ch}
.m.a .b{font-family:'Source Serif 4',Georgia,serif;font-size:16.5px;overflow-wrap:anywhere}
.act{display:flex;gap:2px;margin-top:6px;opacity:.55}.act:hover{opacity:1}
.act button{padding:5px;border-radius:8px;color:var(--mute)}.act button:hover{color:var(--gold);background:rgba(212,175,55,.08)}
.act svg.i{width:16px;height:16px}
.imgs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.imgs img{width:120px;height:120px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#14110a;color:var(--gold2);border-radius:10px;padding:5px 9px;font-size:12.5px;max-width:200px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chip svg.i{width:14px;height:14px;flex-shrink:0}
.b p{margin:0 0 .8em}.b p:last-child{margin:0}
.b h3{font-family:'Sora',sans-serif;margin:1em 0 .4em;color:var(--gold2)}
.b ul,.b ol{margin:.4em 0 .8em;padding-left:1.4em}
.b strong{color:var(--gold2)}
.b code{background:#1a1508;padding:1px 6px;border-radius:5px;font-size:.88em;color:var(--gold2)}
.cb{background:var(--code);border:1px solid var(--line);border-radius:10px;margin:.6em 0;overflow:hidden}
.cb .t{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;font:12px 'Sora',sans-serif;color:var(--mute);border-bottom:1px solid var(--line)}
.cb .t button{color:var(--mute);padding:2px}.cb .t svg.i{width:15px;height:15px}
.cb pre{margin:0;padding:12px;overflow-x:auto}.cb code{background:none;padding:0;font-size:13.5px;color:#e9dfc2}
.cur{display:inline-block;width:8px;height:1em;background:var(--gold);vertical-align:text-bottom;animation:bl 1s steps(2) infinite;box-shadow:0 0 10px var(--gold)}
@keyframes bl{50%{opacity:0}}
.empty{margin:auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty svg.big{width:120px;height:120px;filter:drop-shadow(0 0 30px rgba(212,175,55,.4));animation:fl 6s ease-in-out infinite}
.empty .wm{font-size:30px;letter-spacing:.3em;padding-left:.3em}
@keyframes fl{50%{transform:translateY(-8px)}}
.trace{stroke-dasharray:40 120;animation:tr 3.2s linear infinite}
@keyframes tr{to{stroke-dashoffset:-320}}
.composer{padding:8px 18px 18px}
#thumbs{max-width:780px;margin:0 auto 8px;display:flex;gap:8px;flex-wrap:wrap}
.th{position:relative}
.th img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--gold)}
.th .chip{height:34px}
.th>button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#000;display:grid;place-items:center}
.th>button svg.i{width:12px;height:12px;stroke-width:2.6}
.box{max-width:780px;margin:0 auto;display:flex;gap:6px;align-items:flex-end;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);border-radius:28px;padding:7px;transition:.2s}
.box:focus-within{border-color:var(--gold);box-shadow:0 0 24px rgba(212,175,55,.18)}
textarea{flex:1;resize:none;border:0;outline:0;background:none;color:inherit;font:inherit;max-height:180px;padding:9px 4px;line-height:1.5}
.box .ib{border-color:transparent}
#send{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#000;border:0}
textarea::placeholder{color:var(--mute)}
.plus{position:relative;flex-shrink:0}
.menu{position:absolute;bottom:52px;left:0;min-width:220px;background:#14110a;border:1px solid var(--line);border-radius:14px;padding:6px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.6);z-index:5}
.menu.show{display:block;animation:in .15s ease}
.menu button{display:flex;gap:12px;align-items:center;width:100%;padding:11px 12px;border-radius:9px;color:var(--ink);text-align:left}
.menu button:hover{background:rgba(212,175,55,.1);color:var(--gold2)}
.menu svg.i{color:var(--gold)}
#vmode{color:var(--gold2)}
.gimg{position:relative;margin:10px 0;max-width:440px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0d0b07}
.gimg img{display:block;width:100%;height:auto}
.gimg.sk{aspect-ratio:1;background:linear-gradient(110deg,#14110a 30%,#2e2512 50%,#14110a 70%);background-size:200% 100%;animation:skl 1.3s linear infinite}
@keyframes skl{to{background-position:-200% 0}}
.dl{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.65);display:grid;place-items:center;color:var(--gold2)}
.dl svg.i{width:17px;height:17px}
.toast{max-width:780px;margin:0 auto 8px;text-align:center;font-size:13px;color:#e0765c}
#vo{position:fixed;inset:0;z-index:20;background:rgba(5,4,2,.93);backdrop-filter:blur(10px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:20px}
#vo.show{display:flex}
#orb{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3bd,#d4af37 45%,#6b4f0e);box-shadow:0 0 70px rgba(212,175,55,.45);transform:scale(calc(1 + var(--lv)*.45));transition:transform .08s;cursor:pointer;animation:br 3.5s ease-in-out infinite}
#vo.think #orb{animation:sp 1s linear infinite;border-radius:42% 58% 55% 45%}
#vo.talk #orb{animation:br .8s ease-in-out infinite}
@keyframes br{50%{box-shadow:0 0 110px rgba(246,220,132,.7)}}
@keyframes sp{to{rotate:360deg}}
#vt{max-width:560px;text-align:center;color:var(--mute);font-family:'Source Serif 4',serif;font-size:19px;min-height:60px;overflow:hidden}
body.drag::after{content:"";position:fixed;inset:10px;border:2px dashed var(--gold);border-radius:20px;z-index:30;pointer-events:none;background:rgba(212,175,55,.06)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
@media(max-width:760px){
aside{position:fixed;z-index:5;top:0;bottom:0;left:0;padding-top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-100%);transition:transform .2s}
aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.6)}
#burger{display:grid;top:calc(12px + env(safe-area-inset-top,0px))}#msgs{padding-top:60px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.locked .app{visibility:hidden}
.hi{color:var(--mute);font-size:17px;font-family:'Source Serif 4',serif}.hi b{color:var(--gold2);font-weight:600}
/* intro */
#splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(700px 460px at 50% 46%,rgba(212,175,55,.13),transparent 70%);transition:opacity .7s ease,visibility .7s;cursor:pointer}
#splash.out{opacity:0;visibility:hidden}
.sp-logo{width:150px;height:150px;position:relative;display:grid;place-items:center;animation:fl 5s ease-in-out 2s infinite}
.sp-logo svg{width:100%;height:100%;overflow:visible;animation:glw 1.6s 1.7s ease forwards}
@keyframes glw{to{filter:drop-shadow(0 0 22px rgba(246,220,132,.65))}}
.sp-ring{position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(212,175,55,.45);opacity:0;animation:ring 2.8s ease-out infinite 1.2s}
.sp-ring.r2{animation-delay:2.6s}
@keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.1);opacity:0}}
.sp-box{opacity:0;animation:fi .9s ease forwards}
@keyframes fi{to{opacity:1}}
.sp-draw{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.9s .35s cubic-bezier(.6,.1,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sp-title{display:flex;font-weight:700;font-size:clamp(30px,7vw,56px);letter-spacing:.14em;min-height:1.3em}
.sp-title span{opacity:0;transform:translateY(26px) scale(.7);filter:blur(10px);background:linear-gradient(180deg,#fff3bd,#d4af37 60%,#8a6a1c);-webkit-background-clip:text;background-clip:text;color:transparent;animation:lt .8s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes lt{to{opacity:1;transform:none;filter:none}}
.sp-line{height:2px;width:0;background:linear-gradient(90deg,transparent,#f6dc84,transparent);animation:ln 1.2s 2.5s ease forwards}
@keyframes ln{to{width:min(320px,70vw)}}
.sp-by,.by{color:#ffd21f;font-weight:600;text-shadow:0 0 16px rgba(255,210,31,.5)}
.sp-by{font-size:clamp(11px,2.4vw,14px);letter-spacing:.7em;opacity:0;animation:by 1.3s 3s ease forwards;padding-left:.7em}
@keyframes by{to{opacity:1;letter-spacing:.38em}}
/* login page */
#auth{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#auth.show{display:flex;animation:fi2 .7s ease}
@keyframes fi2{from{opacity:0}}
#auth .card{width:100%;max-width:410px;margin:auto;display:flex;flex-direction:column;gap:12px;border:1px solid #3a2f13;background:rgba(12,10,6,.78);backdrop-filter:blur(20px);border-radius:26px;padding:30px 26px 22px;box-shadow:0 0 90px rgba(212,175,55,.13),inset 0 1px 0 rgba(255,255,255,.05);animation:rise .8s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}}
.chead{display:flex;align-items:center;justify-content:center;gap:10px}
#auth h2{margin:6px 0 0;text-align:center;font-size:22px;font-weight:600;letter-spacing:-.01em}
#auth .sub{margin:0 0 6px;text-align:center;color:var(--mute);font-size:13.5px}
#auth .f{position:relative}
#auth .su{display:none}#auth .card.signup .su{display:block;animation:in .35s ease}
#auth input{width:100%;background:#0b0905;border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:13px 15px;font:inherit;outline:0;transition:.2s}
#auth input::placeholder{color:#6c6140}
#auth input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.14)}
#auth .pw input{padding-right:62px}
#eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--gold);padding:6px 9px;border-radius:8px}
#eye:hover{background:rgba(212,175,55,.1)}
#am{min-height:20px;text-align:center;font-size:13px;line-height:1.4}
#am.e{color:#ef8a73}#am.ok{color:#8fe3a1}
.pri{position:relative;overflow:hidden;border:0;border-radius:14px;padding:13px;font-weight:600;color:#1a1305;background:linear-gradient(135deg,#f6dc84,#d4af37 55%,#b8892a);box-shadow:0 8px 28px rgba(212,175,55,.25);transition:.2s;display:flex;justify-content:center;align-items:center;gap:8px}
.pri:hover{filter:brightness(1.1);transform:translateY(-1px)}.pri:active{transform:scale(.98)}
.pri::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:swp 3.2s ease-in-out infinite}
@keyframes swp{60%,100%{left:120%}}
.pri:disabled{opacity:.7;cursor:wait}
.spin{display:none;width:15px;height:15px;border:2px solid rgba(0,0,0,.25);border-top-color:#000;border-radius:50%;animation:rot .7s linear infinite}
.pri.load .spin{display:block}
@keyframes rot{to{transform:rotate(360deg)}}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
#gbtn{display:flex;justify-content:center;min-height:44px}
.gfake{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:340px;border:1px solid var(--line);border-radius:999px;padding:11px;background:#0b0905;font-weight:500;transition:.2s}
.gfake:hover{border-color:var(--gold);background:#16120a}
.swap{text-align:center;font-size:13.5px;color:var(--mute)}
.swap a{color:var(--gold2);cursor:pointer;font-weight:600;margin-left:4px}.swap a:hover{text-decoration:underline}
.by{text-align:center;font-size:10.5px;letter-spacing:.3em;margin-top:6px;padding-left:.3em}
/* welcome */
#wel{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(5,4,2,.9);backdrop-filter:blur(10px);transition:opacity .8s ease}
#wel.show{display:flex}#wel.out{opacity:0}
#wsp{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#wsp i{position:absolute;border-radius:50%;background:#f6dc84;box-shadow:0 0 12px #f6dc84;opacity:0;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%{opacity:0;transform:translateY(20px) scale(.4)}40%{opacity:1}100%{opacity:0;transform:translateY(-80px) scale(1)}}
.wbox{position:relative;text-align:center;padding:20px}
.wg{font-size:clamp(18px,4vw,26px);color:var(--mute);letter-spacing:.06em;opacity:0;animation:wu .9s .1s ease forwards}
.wn{font-weight:700;font-size:clamp(38px,10vw,84px);letter-spacing:-.01em;line-height:1.1;margin:6px 0 14px;opacity:0;background:linear-gradient(100deg,#8a6a1c 15%,#fff1b0 45%,#d4af37 55%,#8a6a1c 85%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:wu .9s .45s ease forwards,sh 4s linear infinite}
.wt{color:#ffd21f;font-weight:600;letter-spacing:.34em;font-size:clamp(11px,2.5vw,15px);opacity:0;animation:wu .9s .9s ease forwards;padding-left:.34em}
@keyframes wu{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.sp-draw{stroke-dashoffset:0}.sp-title span,.sp-by,.sp-box,.wg,.wn,.wt{opacity:1!important;transform:none!important;filter:none!important}.sp-line{width:200px}.sp-by{letter-spacing:.38em}}
/* ===== layout v2: Claude-style structure (sidebar nav, profile menu, centered home composer) ===== */
aside{width:272px;gap:6px;padding:14px 10px 10px}
.ib.sm{width:32px;height:32px;border-color:transparent}
.nav{display:flex;flex-direction:column;gap:2px;margin:8px 0 6px}
.nv{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;color:var(--ink);text-align:left;width:100%}
.nv svg.i{color:var(--gold);flex-shrink:0}
.nv:hover{background:rgba(212,175,55,.08)}
.nv.on{background:rgba(255,255,255,.06)}
.nv kbd{margin-left:auto;font:11px 'Sora',sans-serif;color:var(--mute)}
.lbl{display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-size:12.5px;font-weight:600;padding:10px 10px 4px;letter-spacing:.02em}
.prof{position:relative;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.pbtn{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:12px;text-align:left}
.pbtn:hover,.pbtn.on{background:rgba(255,255,255,.05)}
.av2{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#1a1305;background:linear-gradient(135deg,var(--gold2),var(--gold));flex-shrink:0;text-transform:uppercase}
.pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn b{font-weight:600}.pn i{font-style:normal;color:var(--mute);font-size:13px}
.pn i.pro{color:var(--gold2)}
.pmenu{position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:#14110a;border:1px solid #3a2f13;border-radius:16px;padding:8px;display:none;box-shadow:0 18px 50px rgba(0,0,0,.65);z-index:8;max-height:calc(100vh - 90px);overflow-y:auto}
.pmenu.show{display:block;animation:in .15s ease}
.pe{padding:8px 10px 10px;color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:10px;text-align:left;color:var(--ink)}
.pi:hover{background:rgba(212,175,55,.1)}
.pi svg.i{color:var(--gold);flex-shrink:0}
.pi .r{margin-left:auto;color:var(--mute);font-size:12.5px;display:flex;align-items:center}
.pi .r svg.i{width:15px;height:15px;color:var(--mute)}
.pi.up{color:var(--gold2);font-weight:600}
.psub{display:none;padding:0 0 4px 30px}.psub.show{display:block}
.hr{height:1px;background:var(--line);margin:6px 4px}
.planpill{display:none;position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px;color:var(--mute);white-space:nowrap;z-index:2}
.planpill a{color:var(--gold2);cursor:pointer;font-weight:600;margin-left:4px}.planpill a:hover{text-decoration:underline}
.planpill.pro{color:var(--gold2);border-color:#5a4817}
main.home .planpill{display:block}
main.home{justify-content:center;padding-bottom:7vh}
main.home #msgs{flex:0 0 auto;overflow:visible;padding:0 18px 22px}
main.home .wrap{min-height:0}
main.home .composer{padding:0 18px}
.empty{margin:0 auto;flex-direction:row;gap:14px;align-items:center;justify-content:center;text-align:left}
.empty svg.big{width:54px;height:54px;filter:drop-shadow(0 0 18px rgba(212,175,55,.45));animation:fl 6s ease-in-out infinite}
.empty h1{margin:0;font:500 clamp(30px,5.4vw,46px)/1.15 'Source Serif 4',Georgia,serif;letter-spacing:-.01em}

function fakeG(why){const b=$("gbtn");b.innerHTML=`<button class="gfake" type="button">${GICON}<span>Continue with Google</span></button>`;
  b.firstChild.onclick=()=>msg(why||"Google sign-in could not load. Reload the page and try again.","e")}
function initGoogle(){
  console.info("INFINITY AI Google sign-in: this page origin is",location.origin,"(it must be listed under Authorized JavaScript origins)");
  if(!(gcfg&&gcfg.google_client_id))return fakeG("Google sign-in is not set up yet. Add GOOGLE_CLIENT_ID to backend/.env (steps are in the README).");
  const sc=document.createElement("script");sc.src="https://accounts.google.com/gsi/client";sc.async=true;
  sc.onload=()=>{try{google.accounts.id.initialize({client_id:gcfg.google_client_id,callback:r=>googleLogin(r.credential)});
    google.accounts.id.renderButton($("gbtn"),{theme:"filled_black",size:"large",shape:"pill",text:"continue_with",width:300})}catch(e){fakeG("Google sign-in could not start: "+e.message)}};

/* welcome wish */
function sparkle(){const w=$("wsp");w.innerHTML="";for(let i=0;i<34;i++){const d=document.createElement("i"),z=2+Math.random()*5;
  d.style.cssText=`left:${Math.random()*100}%;top:${30+Math.random()*60}%;width:${z}px;height:${z}px;animation-delay:${Math.random()*2}s;animation-duration:${2+Math.random()*2}s`;w.appendChild(d)}}
function welcome(name){const w=$("wel");$("wg").textContent=greet()+",";$("wn").textContent=name||"friend";sparkle();w.classList.remove("out");w.classList.add("show");
  setTimeout(()=>{w.classList.add("out");setLocked(false);cur=null;renderAll();setTimeout(()=>w.classList.remove("show","out"),850)},3200)}
async function enter(tok,name,info){token=tok;try{localStorage.setItem(TK,tok)}catch(_){}userName=name||"";setPlan(info||{});
  $("auth").classList.remove("show");$("pw").value="";await load();welcome(userName)}
$("go").onclick=submit;
["nm","em","pw"].forEach(i=>$(i).addEventListener("keydown",e=>{if(e.key==="Enter")submit()}));
$("eye").onclick=()=>{const p=$("pw"),h=p.type==="password";p.type=h?"text":"password";$("eye").textContent=h?"Hide":"Show"};
$("sw").onclick=e=>{if(e.target.id==="swl")setMode(authMode==="login"?"signup":"login")};
async function boot(){
  renderAll();setMode("login");
  try{gcfg=await (await fetch("/api/config")).json()}catch(_){gcfg={}}
  initGoogle();await splashDone;
  if(!token){showAuth();return}
  try{const r=await api("/me");if(!r.ok)throw 0;const me=await r.json();userName=me.name;setPlan(me);await load();setLocked(false);renderAll()}catch(e){showAuth()}}
/* ---------- v2: profile menu, modals, plans, Razorpay ---------- */
const NAMES={"":"Auto","en-US":"English","hi-IN":"Hindi","te-IN":"Telugu","ta-IN":"Tamil","es-ES":"Spanish","fr-FR":"French"};
const getLang=()=>{try{return localStorage.getItem("infinity_lang")||""}catch(_){return ""}};
const isPro=()=>userPlan==="pro"&&(!planUntil||new Date(planUntil)>new Date());
const price=()=>"\u20B9"+((gcfg&&gcfg.price_inr!=null)?gcfg.price_inr:1);
const fmtDate=d=>new Date(d).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
function setPlan(o){if(!o)return;userEmail=o.email||userEmail;userPlan=o.plan||"free";planUntil=o.plan_until||null;paintPlan()}
function paintPlan(){const pro=isPro();
  $("pName").textContent=userName||"Guest";$("pAv").textContent=(userName||"?").trim().charAt(0)||"?";
  $("pPlan").textContent=pro?"Pro":"Free";$("pPlan").className=pro?"pro":"";
  $("pEmail").textContent=userEmail;$("mUpT").textContent=pro?"Manage plan":"Upgrade plan";
  $("langCur").textContent=NAMES[getLang()]||"Auto";
  const pp=$("planPill");pp.className="planpill"+(pro?" pro":"");
  pp.innerHTML=pro?"Pro plan \u00B7 active until "+(planUntil?fmtDate(planUntil):""):'Free plan \u00B7 <a id="pillUp">Upgrade</a>';
  $("modelBtn").classList.toggle("lock",!pro);$("modelLvl").textContent=deep?"Deep":"Standard";$("mDeep").style.opacity=pro?1:.85}
function toggleDeep(){if(!isPro()){openUpgrade("Deep thinking is a Pro feature.");return false}deep=!deep;paintPlan();return true}
function setImageMode(v){imageMode=v;$("segImg").classList.toggle("on",v);$("segChat").classList.toggle("on",!v);
  $("in").placeholder=v?"Describe the image you want...":"Message INFINITY AI  (type / for tools)"}
/* sidebar nav */
const closeSide=()=>$("side").classList.remove("open");
$("navSearch").onclick=()=>{closeSide();openSearch()};
$("navImage").onclick=()=>{closeSide();if(busy)return;cur=null;renderAll();setImageMode(true);$("in").focus()};
$("navDocs").onclick=()=>{closeSide();$("fDoc").click()};
$("navVoice").onclick=()=>{closeSide();$("vmode").click()};
$("collapse").onclick=()=>{if(innerWidth<=760)closeSide();else document.body.classList.add("sc")};
$("burger").onclick=()=>{if(document.body.classList.contains("sc"))document.body.classList.remove("sc");else $("side").classList.toggle("open")};
/* composer extras */
$("segChat").onclick=()=>setImageMode(false);
$("segImg").onclick=()=>{setImageMode(true);$("in").focus()};
$("modelBtn").onclick=()=>toggleDeep();
$("mImage").onclick=()=>{$("addMenu").classList.remove("show");setImageMode(true);$("in").focus()};
$("mDeep").onclick=()=>{$("addMenu").classList.remove("show");toggleDeep()};
$("addMenu").addEventListener("click",()=>{if($("in").value==="/"){$("in").value="";autosize()}});
$("in").addEventListener("input",()=>{if($("in").value==="/")$("addMenu").classList.add("show")});
const CHIPS=[["code","Code","Write code to "],["pen","Write","Help me write "],["cap","Learn","Explain in simple words: "],["photo","Image",null],["cup","Life stuff","Give me practical advice on "],["bulb","Surprise me",null]];
const SURPRISE=["Tell me a fascinating fact about space and explain why it matters.","Teach me something genuinely useful in five minutes.","Give me a fun challenge I can finish today.","Explain how the internet works like I am 12 years old."];
$("chips").innerHTML=CHIPS.map((c,i)=>`<button class="chip2" data-c="${i}">${ic(c[0])}${c[1]}</button>`).join("");
$("chips").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;const c=CHIPS[+b.dataset.c],t=$("in");
  if(c[1]==="Image"){setImageMode(true)}else{t.value=c[2]||SURPRISE[Math.random()*SURPRISE.length|0]}
  autosize();t.focus();t.setSelectionRange(t.value.length,t.value.length)};
/* profile menu */
const pMenu=$("pMenu");
function closeMenus(){pMenu.classList.remove("show");$("pBtn").classList.remove("on");$("addMenu").classList.remove("show")}
$("pBtn").onclick=e=>{e.stopPropagation();const s=!pMenu.classList.contains("show");closeMenus();if(s){pMenu.classList.add("show");$("pBtn").classList.add("on");paintPlan()}};
document.addEventListener("click",e=>{if(!e.target.closest("#profWrap")){pMenu.classList.remove("show");$("pBtn").classList.remove("on")}
  if(e.target.id==="pillUp")openUpgrade("",true)});
const act=(id,fn)=>$(id).onclick=()=>{closeMenus();closeSide();fn()};
act("mSet",openSettings);act("mLang",openLang);act("mHelp",openHelp);act("mUp",()=>openUpgrade("",true));act("mApps",openApps);
act("mAbout",openAbout);act("mKeys",openShortcuts);act("mApi",openApiKeys);act("mOut",logout);
$("mLearn").onclick=()=>$("learnSub").classList.toggle("show");
/* modals */
function openMdl(html,wide){const m=$("mdl");m.innerHTML=`<div class="mc${wide?" wide":""}" role="dialog" aria-modal="true"><button class="ib sm cl" data-x aria-label="Close">${ic("x")}</button>${html}</div>`;m.classList.add("show");return m.firstChild}
function closeMdl(){const m=$("mdl");m.classList.remove("show");m.innerHTML=""}
$("mdl").addEventListener("click",e=>{if(e.target.id==="mdl"||e.target.closest("[data-x]"))closeMdl()});
function clearAll(){if(busy)return;if(!chats.length)return toast("There are no chats to delete.");
  if(confirm("Delete all chats?")){chats=[];cur=null;api("/conversations",{method:"DELETE"}).catch(()=>{});renderAll()}}
async function openSettings(){
  let info=null;try{const r=await api("/me");if(r.ok){info=await r.json();setPlan(info)}}catch(_){}
  const pro=isPro();
  openMdl(`<h3>Settings</h3><p class="sub2">Your INFINITY AI account and preferences.</p>
  <div class="row"><div>Account<small>${esc(userName)} \u00B7 ${esc(userEmail)}</small></div></div>
  <div class="row"><div>Plan<small>${pro?"Pro \u00B7 active until "+fmtDate(planUntil):"Free"}${info?" \u00B7 "+info.used+" of "+info.limit+" messages used in the last 24 hours":""}</small></div><button class="btn2" id="sUp">${pro?"Extend":"Upgrade"}</button></div>
  <div class="row"><div>Read answers aloud<small>Speak every answer using your device voice</small></div><button class="sw${speakOn?" on":""}" id="sSpeak" aria-label="Read answers aloud"></button></div>
  <div class="row"><div>Deep thinking<small>Longer, more careful answers (Pro)</small></div><button class="sw${deep?" on":""}" id="sDeep" aria-label="Deep thinking"></button></div>
  <div class="row"><div>Delete all chats<small>Removes your saved chat history</small></div><button class="btn2 danger" id="sClear">Delete</button></div>`);
  $("sUp").onclick=()=>openUpgrade("",true);
  $("sSpeak").onclick=e=>{speakOn=!speakOn;e.currentTarget.classList.toggle("on",speakOn);if(!speakOn)stopSpeak()};
  $("sDeep").onclick=e=>{if(toggleDeep())e.currentTarget.classList.toggle("on",deep)};
  $("sClear").onclick=()=>{closeMdl();clearAll()}}
function openLang(){const cur=getLang();
  openMdl(`<h3>Language</h3><p class="sub2">Used for voice input and for reading answers aloud. INFINITY AI already replies in the language you write in.</p><div class="lg">${Object.entries(NAMES).map(([k,v])=>`<button data-l="${k}" class="${k===cur?"on":""}"><span>${v}</span><span>${k===cur?"\u2713":""}</span></button>`).join("")}</div>`);
  $("mdl").querySelector(".lg").onclick=e=>{const b=e.target.closest("[data-l]");if(!b)return;try{localStorage.setItem("infinity_lang",b.dataset.l)}catch(_){}paintPlan();closeMdl()}}
function openHelp(){openMdl(`<h3>Get help</h3><p class="sub2">Quick answers about INFINITY AI.</p>
  <div class="row"><div>Send photos, PDFs or documents<small>Press + , drag and drop a file, or paste an image into the message box.</small></div></div>
  <div class="row"><div>Create an image<small>Switch the box to Image, or type "Create an image of ..." and send.</small></div></div>
  <div class="row"><div>Talk to INFINITY AI<small>Press the voice button. Press Esc to stop. Pick your voice language in Language.</small></div></div>
  <div class="row"><div>Download as Word<small>Ask for a letter, report or resume, then press the document icon under the answer.</small></div></div>
  <div class="row"><div>Daily limits and Pro<small>Free accounts have a daily message limit. Upgrade plan raises it and unlocks deep thinking.</small></div></div>
  <div class="row"><div>Something broken?<small>Reload the page and log in again. If it continues, tell the developer, Sarath Chandra.</small></div></div>`)}
let deferredInstall=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e});
function openApps(){openMdl(`<h3>Get apps and extensions</h3><p class="sub2">Use INFINITY AI like a real app on your phone or computer.</p>
  ${deferredInstall?'<button class="pri" id="inst" style="width:100%;margin-bottom:12px">Install INFINITY AI</button>':""}
  <div class="row"><div>Android (Chrome)<small>Menu (three dots) &gt; Install app, or Add to Home screen.</small></div></div>
  <div class="row"><div>iPhone (Safari)<small>Share button &gt; Add to Home Screen.</small></div></div>
  <div class="row"><div>Windows or Mac (Chrome / Edge)<small>Click the install icon at the right of the address bar.</small></div></div>
  <div class="row"><div>Share INFINITY AI<small>${esc(location.origin)}</small></div><button class="btn2" id="cpLink">Copy link</button></div>`);
  if($("inst"))$("inst").onclick=async()=>{deferredInstall.prompt();await deferredInstall.userChoice.catch(()=>{});deferredInstall=null;closeMdl()};
  $("cpLink").onclick=e=>{(navigator.clipboard?navigator.clipboard.writeText(location.origin):Promise.reject()).then(()=>e.currentTarget.textContent="Copied").catch(()=>e.currentTarget.textContent="Copy blocked")}}
function openAbout(){openMdl(`<h3>About INFINITY AI</h3><p class="sub2">A voice and text assistant with chat, photo and PDF reading, image creation and Word export.</p>
  <div class="row"><div>Powered by<small style="color:#ffd21f;letter-spacing:.2em;font-weight:600">SARATH CHANDRA</small></div></div>
  <div class="row"><div>Plans<small>Free and Pro (${esc(price())} for ${(gcfg&&gcfg.pro_days)||30} days)</small></div></div>`)}
function openShortcuts(){openMdl(`<h3>Keyboard shortcuts</h3><p class="sub2">Faster ways to use INFINITY AI on a computer.</p>
  <dl class="kv"><dt><kbd>Enter</kbd></dt><dd>Send message</dd><dt><kbd>Shift</kbd> + <kbd>Enter</kbd></dt><dd>New line</dd><dt><kbd>Ctrl</kbd> + <kbd>K</kbd></dt><dd>Search chats</dd><dt><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>,</kbd></dt><dd>Settings</dd><dt><kbd>/</kbd></dt><dd>Open the tools menu</dd><dt><kbd>Esc</kbd></dt><dd>Close a window or stop voice</dd></dl>`)}
function openApiKeys(){openMdl(`<h3>Get free API keys</h3><p class="sub2">INFINITY AI answers through these providers. Put keys in <b>backend/.env</b> on your server, never in this page.</p>
  <div class="row"><div>Groq (Llama)<small>Free tier. Line: GROQ_API_KEY=</small></div><a class="btn2" href="https://console.groq.com/keys" target="_blank" rel="noopener">Open</a></div>
  <div class="row"><div>Google Gemini<small>Free tier, can read images. Line: GEMINI_API_KEY=</small></div><a class="btn2" href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Open</a></div>
  <div class="row"><div>OpenRouter<small>Free models available. Line: OPENROUTER_API_KEY=</small></div><a class="btn2" href="https://openrouter.ai/keys" target="_blank" rel="noopener">Open</a></div>`)}
function openSearch(){
  openMdl(`<h3>Search chats</h3><p class="sub2">Find anything you asked before.</p><input class="sbox" id="sq" placeholder="Search your chats..." autocomplete="off"><div class="res" id="sres"></div>`);
  const draw=()=>{const q=$("sq").value.trim().toLowerCase(),out=[];
    for(const c of chats){const hit=!q||c.title.toLowerCase().includes(q);let snip="";
      if(q){const m=c.messages.find(m=>(m.content||"").toLowerCase().includes(q));if(m){const i=m.content.toLowerCase().indexOf(q);snip=m.content.slice(Math.max(0,i-30),i+70).replace(/\s+/g," ")}}
      if(hit||snip)out.push({c,snip})}
    $("sres").innerHTML=out.length?out.slice(0,40).map(o=>`<button data-id="${esc(o.c.id)}"><b>${esc(o.c.title)}</b>${o.snip?"<span>"+esc(o.snip)+"</span>":""}</button>`).join(""):'<p class="sub2">No chats found.</p>'};
  $("sq").oninput=draw;draw();$("sq").focus();
  $("sres").onclick=e=>{const b=e.target.closest("button[data-id]");if(!b||busy)return;cur=b.dataset.id;closeMdl();renderAll()}}
/* upgrade plan + Razorpay */
const pmsg=(t,k)=>{const e=$("pm");if(e){e.textContent=t||"";e.className=k||""}};
function openUpgrade(note,auto){
  const pro=isPro(),pr=price(),days=(gcfg&&gcfg.pro_days)||30,fl=(gcfg&&gcfg.free_limit)||25,pl=(gcfg&&gcfg.pro_limit)||200;
  openMdl(`<h3>${pro?"You are on Pro":"Upgrade your plan"}</h3><p class="sub2">${note?esc(note)+" ":""}${pro?"Active until "+fmtDate(planUntil)+". Pay again to add "+days+" more days.":"More messages and deep thinking. One small payment, no auto-renewal."}</p>
  <div class="plans"><div class="pc free"><h4>Free</h4><div class="price">\u20B90</div><ul><li>${fl} messages per day</li><li>Voice, files, photos, images</li><li>Standard answers</li></ul></div>
  <div class="pc pro"><h4>Pro</h4><div class="price">${pr}<small> / ${days} days</small></div><ul><li>${pl} messages per day</li><li>Deep thinking mode</li><li>Everything in Free</li></ul></div></div>
  <button class="pri" id="payBtn" style="width:100%"><span>${pro?"Pay "+pr+" and extend":"Pay "+pr+" and upgrade"}</span><i class="spin"></i></button>
  <div id="pm" role="status"></div><div class="fine">Secure payment by Razorpay. Scan the UPI QR with any UPI app, or use cards and netbanking.</div>`);
  $("payBtn").onclick=startPay;
  if(gcfg&&gcfg.razorpay===false)pmsg("Payments are not set up on this server yet.","e");
  else if(auto)startPay()}
let payBusy=false;
function loadRzp(){return window.Razorpay?Promise.resolve():new Promise((ok,bad)=>{const s=document.createElement("script");s.src="https://checkout.razorpay.com/v1/checkout.js";s.onload=ok;
  s.onerror=()=>bad(new Error("Could not load Razorpay. Check your internet and turn off ad blockers for this page."));document.head.appendChild(s)})}
async function startPay(){
  if(payBusy)return;payBusy=true;let paid=false;const b=$("payBtn");b.classList.add("load");b.disabled=true;pmsg("Creating a secure order...");
  const done=()=>{payBusy=false;const x=$("payBtn");if(x){x.classList.remove("load");x.disabled=false}};
  try{
    const r=await api("/pay/order",{method:"POST"});const o=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(typeof o.detail==="string"?o.detail:"Could not start the payment.");
    await loadRzp();
    const rz=new Razorpay({key:o.key_id,order_id:o.order_id,amount:o.amount,currency:o.currency,name:"INFINITY AI",
      description:"Pro plan \u00B7 "+((gcfg&&gcfg.pro_days)||30)+" days",prefill:{name:o.name||userName,email:o.email||userEmail},theme:{color:"#d4af37"},
      config:{display:{blocks:{upi:{name:"Scan QR or pay with UPI",instruments:[{method:"upi"}]}},sequence:["block.upi"],preferences:{show_default_blocks:true}}},
      modal:{ondismiss:()=>{if(!paid)pmsg("Payment window closed. You are charged only if the payment completed.");done()}},
      handler:async resp=>{paid=true;pmsg("Confirming your payment...");
        try{const v=await api("/pay/verify",{method:"POST",body:JSON.stringify(resp)});const j=await v.json().catch(()=>({}));
          if(!v.ok)throw new Error(typeof j.detail==="string"?j.detail:"Could not confirm the payment.");
          setPlan(j);pmsg("Payment received. You are now on Pro!","ok");setTimeout(()=>{if($("pm"))openUpgrade()},1600)}
        catch(e){pmsg(e.message,"e")}done()}});
    rz.on("payment.failed",ev=>{pmsg((ev.error&&ev.error.description)||"Payment failed. Try again.","e");done()});
    pmsg("");rz.open()
  }catch(e){pmsg(e.message,"e");done()}}
addEventListener("keydown",e=>{if(document.body.classList.contains("locked"))return;const k=(e.key||"").toLowerCase();
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&k==="k"){e.preventDefault();openSearch()}
  else if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key===","){e.preventDefault();openSettings()}
  else if(e.key==="Escape"&&$("mdl").classList.contains("show"))closeMdl()});
paintPlan();
boot();
